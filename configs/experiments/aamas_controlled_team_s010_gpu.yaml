{
  "seed": 42,
  "run_name": "aamas_controlled_team_s010_gpu",
  "model": {
    "id": "Qwen/Qwen3-0.6B",
    "revision": null,
    "dtype": "auto",
    "device": "auto",
    "backend": "hf",
    "max_new_tokens": 32
  },
  "benchmark": {
    "name": "controlled_arithmetic",
    "split_strategy": "template_disjoint",
    "calibration_size": 24,
    "dev_size": 8,
    "test_size": 48
  },
  "roles": {
    "names": ["planner", "solver", "critic", "verifier"],
    "prompt_file": "configs/roles/controlled_checker_roles.json"
  },
  "importance": {
    "method": "activation_weight",
    "alpha": 1.0,
    "beta": 0.5,
    "epsilon": 1.0e-8
  },
  "pruning": {
    "structural_unit": "mlp_intermediate",
    "sparsities": [0.10],
    "per_layer_ratio": true,
    "random_seeds": [1, 2, 3]
  },
  "mask_building": {
    "input_stats_path": "artifacts/activation_stats/aamas_controlled_confirmatory_stats.json",
    "output_template": "artifacts/masks/aamas_controlled_confirmatory_s010_{sparsity}.json",
    "source": "aamas_controlled_confirmatory_s005_gpu"
  },
  "team_eval": {
    "split": "test",
    "max_items": 48,
    "max_new_tokens": 32,
    "checker_role": "verifier",
    "bootstrap_samples": 10000,
    "reference_condition": "unmasked",
    "masks_path": "artifacts/masks/aamas_controlled_confirmatory_s010_0.1.json",
    "conditions": {
      "unmasked": {
        "solver_mask": "unmasked",
        "checker_mask": "unmasked"
      },
      "role_specific": {
        "solver_mask": "solver",
        "checker_mask": "verifier"
      },
      "swapped": {
        "solver_mask": "verifier",
        "checker_mask": "solver"
      },
      "generic": {
        "solver_mask": "generic",
        "checker_mask": "generic"
      },
      "solver_mask_only": {
        "solver_mask": "solver",
        "checker_mask": "unmasked"
      },
      "checker_mask_only": {
        "solver_mask": "unmasked",
        "checker_mask": "verifier"
      },
      "random_seed_1": {
        "solver_mask": "random_seed_1",
        "checker_mask": "random_seed_1"
      },
      "random_seed_2": {
        "solver_mask": "random_seed_2",
        "checker_mask": "random_seed_2"
      },
      "random_seed_3": {
        "solver_mask": "random_seed_3",
        "checker_mask": "random_seed_3"
      }
    },
    "output_path": "results/aamas_controlled_team_s010_metrics.json",
    "predictions_path": "results/aamas_controlled_team_s010_predictions.jsonl"
  },
  "generation": {
    "do_sample": false
  }
}
