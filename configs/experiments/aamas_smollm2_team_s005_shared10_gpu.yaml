    "revision": null,
    "dtype": "float16",
    "quantization": "int8",
    "use_chat_template": true,
    "device": "auto",
    "backend": "hf",
    "max_new_tokens": 32
  },
  "benchmark": {
    "name": "controlled_arithmetic",
    "split_strategy": "template_disjoint",
    "calibration_size": 24,
    "dev_size": 8,
    "test_size": 48
