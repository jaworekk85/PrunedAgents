    "alpha": 1.0,
    "beta": 0.5,
    "epsilon": 1e-08
  },
  "pruning": {
    "structural_unit": "mlp_intermediate",
    "sparsities": [
      0.1
    ],
    "per_layer_ratio": true,
    "random_seeds": [
      1,
      2,
      3
    ]
  },
  "mask_building": {
