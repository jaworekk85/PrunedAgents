  "model": {
    "id": "HuggingFaceTB/SmolLM2-1.7B-Instruct",
    "revision": null,
    "dtype": "auto",
    "device": "auto",
    "backend": "hf",
    "max_new_tokens": 48,
    "quantization": "int8",
    "use_chat_template": true
  },
  "benchmark": {
    "name": "babi",
    "task": 1,
    "calibration_size": 24,
    "dev_size": 8,
    "test_size": 48
