{
  "seed": 42,
  "run_name": "aamas_controlled_persona_masks_gpu",
  "model": {
    "id": "Qwen/Qwen3-0.6B",
    "revision": null,
    "dtype": "auto",
    "device": "auto",
    "backend": "hf",
    "max_new_tokens": 32
  },
  "benchmark": {
    "name": "controlled_arithmetic",
    "split_strategy": "template_disjoint",
    "calibration_size": 24,
    "dev_size": 8,
    "test_size": 48
  },
  "roles": {
    "names": [
      "planner",
      "solver",
      "critic",
      "verifier"
    ],
    "prompt_file": "configs/roles/controlled_checker_roles.json",
    "include_system_prompt": true
  },
  "candidate_policy": {
    "default_mode": "gold",
    "wrong_offset": 1,
    "mode_by_role": {
      "planner": "unused",
      "solver": "no_answer_plan",
      "critic": "wrong_answer_only",
      "verifier": "wrong_answer_only"
    }
  },
  "activation_collection": {
    "split": "calibration",
    "max_pairs": 96,
    "output_path": "artifacts/activation_stats/aamas_controlled_persona_stats.json",
    "response_cache_path": "artifacts/cached_responses/aamas_controlled_persona.jsonl"
  },
  "importance": {
    "method": "activation_weight",
    "alpha": 1.0,
    "beta": 0.5,
    "epsilon": 1e-08
  },
  "pruning": {
    "structural_unit": "mlp_intermediate",
    "sparsities": [
      0.05,
      0.1,
      0.15
    ],
    "per_layer_ratio": true,
    "random_seeds": [
      1,
      2,
      3
    ]
  },
  "mask_building": {
    "input_stats_path": "artifacts/activation_stats/aamas_controlled_persona_stats.json",
    "output_template": "artifacts/masks/aamas_controlled_persona_{sparsity}.json",
    "source": "aamas_controlled_persona_masks_gpu"
  },
  "generation": {
    "do_sample": false
  }
}
