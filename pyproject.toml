[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prunedagents"
version = "0.1.0"
description = "Role-specialized compression experiments for multi-agent LLM systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.33",
  "datasets>=2.20",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "scipy>=1.12",
  "torch>=2.3",
  "transformers>=4.44",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
gpu = [
  "bitsandbytes>=0.46",
]

[project.scripts]
role-pruning = "role_pruning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
